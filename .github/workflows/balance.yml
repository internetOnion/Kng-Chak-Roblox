name: Balance report

# Plays full emergency calls headless and reports HP lost and time per wave
# (.lune/balance.luau). A report, not a gate: it never fails the build.
on:
  pull_request:
    paths:
      - "src/shared/**"
      - "tests/Pilot.luau"
      - ".lune/balance.luau"

jobs:
  balance:
    name: Balance report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install tools from rokit.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rokit authenticate github --token "$GITHUB_TOKEN"
          rokit install --no-trust-check

      - name: Play the calls
        continue-on-error: true
        run: lune run balance | tee -a "$GITHUB_STEP_SUMMARY"
